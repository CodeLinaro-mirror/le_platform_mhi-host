name: imx-kernel
type: kernel
build-base: core26
adopt-info: kernel
summary: The i.MX family Linux kernel
description: |
  This snap provides the kernel, modules, firmware, and initrd required to
  create an kernel snap the NXP i.MX family.

  The kernel and initrd are provided as a single universal kernel image file
  which is then booted by the managed assets created and owned by snapd.
  Generally, this snap would also provide the device tree files for the target
  hardware. However, in this case, that device tree is provided by the u-boot
  binary in our gadget snap. If we needed it here, we could likewise add that
  file to our UKI.

  ** Note that the license information for this snap is incomplete **
  Do your due diligence to ensure compliance with the licenses of the contents of this snap.

  This snapcraft.yaml is licensed under CC-BY-SA-4.0

  You can find any and all licenses for the contents of this snap at the following locations:

  kernel:             https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/resolute
  linux-firmware:     https://git.launchpad.net/ubuntu/+source/linux-firmware/tree/?h=applied/ubuntu/resolute

  Additional licenses can also be found within this snap in the licenses/ top-level directory.

grade: stable
confinement: strict

license: "GPL-2.0 AND GPL-3.0 AND CC-BY-SA-4.0"

platforms:
  arm64:
    build-on: [amd64, arm64]
    build-for: arm64

parts:
  # Provide the kernel.
  # Trimming any modules we know a priori to not be needed by the target device
  # can marginally reduce kernel snap size.
  kernel:
    plugin: kernel
    kernel-ubuntu-kconfigflavour: imx
    build-environment:
      - KERNEL_IMAGE: Image
      - PATH: "/usr/lib/ccache:${PATH}"
    override-build: |
      craftctl default
      craftctl set version=$(git --git-dir=${CRAFT_PROJECT_DIR}/.git describe --tags | cut -c 12-42 | sed 's/-snap$//')
    override-stage: |
      # keep only listed modules
      "${CRAFT_PROJECT_DIR}/prune-kernel-modules.sh" "${CRAFT_PART_INSTALL}" "${CRAFT_PROJECT_DIR}/imx-keep.modules"
      craftctl default
    prime:
      - -vmlinuz*
      - -dtbs

  # Provide the initrd for Ubuntu Core mini.
  #
  # A single static Rust binary which maps the dm-verity base snap of the active
  # A/B slot and pivots into it, in place of the 'dm-mod.create=' table the
  # bootloader writes on the kernel command line. It runs no shell, spawns no
  # second process and waits on no udev, so what it costs before userspace is
  # small enough to pay for a root hash that comes from a signed assertion.
  #
  # It carries no modules and no firmware. The i.MX kernels build their storage,
  # device mapper and squashfs drivers in, and this initrd probes nothing that a
  # driver would ask firmware for - so the three initrd-firmware files the Ubuntu
  # Core initrd needed are gone with it.
  #
  # Three things here are load bearing rather than stylistic:
  #  - it stays named 'initrd', because 'firmware-imx' and 'fit-image' order
  #    themselves after that name
  #  - it still leaves '${CRAFT_STAGE}/initrd.img' behind, because
  #    kernel_arm64.its does 'data = /incbin/("./initrd.img")', and that is also
  #    what puts the ramdisk under the FIT signature
  #  - 'after: firmware' is not this part's own dependency. It is what keeps
  #    'firmware-imx' ordered after 'firmware', which it gets through this part
  initrd:
    after:
      - firmware
    plugin: nil
    source: https://git.launchpad.net/~ondrak/+git/uc-mini-initramfs
    source-type: git
    source-branch: master
    source-depth: 1
    override-pull: |
      craftctl default
      # rustup installs the toolchain rust-toolchain.toml pins, and the musl target
      # with it, the first time cargo runs. Doing that here keeps the download in
      # the phase which is meant to reach the network, and fails at the pull step
      # rather than part way through a build if it cannot
      cargo --version
    override-build: |
      # mkinitrd.sh builds the binary and assembles the cpio, and picks the linker
      # itself: the native cc when building on arm64, gcc-aarch64-linux-gnu when
      # cross building on amd64. It would default to the build-for architecture on
      # its own, naming it keeps the initrd and the kernel visibly the same one.
      # The build runs as root in an unprivileged container, which cannot mknod
      # /dev/console - the script falls back to fakeroot for that
      ./mkinitrd.sh --arch "${CRAFT_ARCH_BUILD_FOR}" --output "${CRAFT_PART_INSTALL}/initrd.img"
    prime:
      - -initrd.img*

  firmware:
    after:
      - firmware-trim-tool
      - kernel
    plugin: nil
    stage-packages:
      - linux-firmware-misc
      - linux-firmware-qualcomm-wireless
      - wireless-regdb
    organize:
      lib/firmware: firmware
      usr/lib/firmware: firmware
    override-stage: |
      # do not re-run trim tool if already run
      fw_marker="${CRAFT_PART_INSTALL}/.firmware-trimmed"
      if [ ! -e "${fw_marker}" ]; then
        # Trim firmware
        "${CRAFT_STAGE}/trim-firmware" "${CRAFT_PART_INSTALL}" "${CRAFT_STAGE}"
        touch "${fw_marker}"
        craftctl default
      fi
    prime:
      - firmware

  firmware-trim-tool:
    plugin: dump
    source: https://git.launchpad.net/~ondrak/canonical-kernel-snaps
    source-branch: main
    source-depth: 1
    source-type: git
    stage:
      - trim-firmware
    prime:
      - -*

  firmware-imx:
    after:
      - initrd
    plugin: dump
    source: https://github.com/nxp-imx/imx-firmware.git
    source-type: git
    source-depth: 1
    source-tag: lf-6.18.20-2.0.0
    organize:
      'FwImage_9098_PCIE/uart9098_bt_v1.bin': firmware/nxp/pcieuart9098_bt_v1.bin
      'FwImage_9098_*/*':   firmware/nxp/
      'FwImage_IW610_SD/*': firmware/nxp/
      'FwImage_IW612_SD/*': firmware/nxp/
      'wifi_mod_para.conf': firmware/nxp/
    stage:
      - firmware/nxp

  test-signing-keys:
    plugin: dump
    source: https://git.launchpad.net/~ondrak/+git/dev-keys
    source-type: git
    source-branch: master
    organize:
      '*': signing-key/
    prime:
      - -*

  sign-kernel-bin:
    after:
      - kernel
      - test-signing-keys
    plugin: nil
    override-build: |
      sbsign \
         --key "${CRAFT_STAGE}/signing-key/Canonical-dev.key" \
         --cert "${CRAFT_STAGE}/signing-key/Canonical-dev.crt" \
         --output "${CRAFT_PART_INSTALL}/vmlinuz.signed" \
         "${CRAFT_STAGE}/vmlinuz"
    prime:
      - -*

  fit-image:
    after:
      - initrd
      - sign-kernel-bin
      - test-signing-keys
    plugin: nil
    override-build: |
      cp ${CRAFT_PROJECT_DIR}/kernel_${CRAFT_ARCH_BUILD_FOR}.its \
         ${CRAFT_STAGE}/kernel_${CRAFT_ARCH_BUILD_FOR}.its
      # include key dir in case there are keys available
      mkimage \
        -f ${CRAFT_STAGE}/kernel_${CRAFT_ARCH_BUILD_FOR}.its \
        -r ${CRAFT_PART_INSTALL}/kernel.img \
        -k ${CRAFT_STAGE}/signing-key
      rm ${CRAFT_STAGE}/kernel_${CRAFT_ARCH_BUILD_FOR}.its

  # dummy snapd-info, even if we do not actually have snapd-bootstrap here
  snapd-info:
    plugin: nil
    override-build: |
      { echo "VERSION=2.75.2"
        echo "SNAPD_APPARMOR_REEXEC=1"
        echo "SNAPD_ASSERTS_FORMATS='{\"account-key\":1,\"snap-declaration\":6,\"system-user\":2}'"
      } > "${CRAFT_PART_INSTALL}/snapd-info"

build-snaps:
  - rustup

build-packages:
  - bison
  - ccache
  - cpio
  - device-tree-compiler
  - dpkg-dev
  - flex
  - gawk
  - libdw-dev
  - libfdt-dev
  - libssl-dev
  - pkgconf
  - python3-cryptography
  - python3-pycryptodome
  - python3-pyelftools
  - python3-serial
  - sbsigntool
  - u-boot-tools
  - uuid-dev
  - wget
  - zstd
  - on amd64:
    - gcc-aarch64-linux-gnu
  - on arm64:
    - gcc
